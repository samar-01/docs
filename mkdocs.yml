site_name: SnappyXO Products Documentation
site_description: Documentation for SnappyXO hardware and software.
site_url: https://snappyxo.github.io/docs/
# repo_url: https://github.com/snappyxo/libraries
# edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: docs

extra_javascript:
  - https://cdn.jsdelivr.net/npm/compare-versions@6/lib/umd/index.js
  - javascripts/version-check.js

nav:
  - Home: index.md
  - Software:
    - MicroBlue:
      - Overview: software/microblue/index.md
      - Getting Started: software/microblue/getting-started.md
      - API Reference: software/microblue/api-reference.md
      - Message Protocol: software/microblue/protocol.md
      - Examples: software/microblue/examples.md
    - SnappyXOShield:
      - Overview: software/snappyxoshield/index.md
      - Getting Started: software/snappyxoshield/getting-started.md
      - API Reference: software/snappyxoshield/api-reference.md
      - Examples: software/snappyxoshield/examples.md
    - SnappyXOExamples:
      - Overview: software/snappyxoexamples/index.md
  - Hardware:
    - SnappyXO Motor Shield:
      - Overview: hardware/motor-shield/index.md
      - Getting Started: hardware/motor-shield/getting-started.md
      - Power: hardware/motor-shield/power.md
      - Connectors: hardware/motor-shield/connectors.md
      - Expansion: hardware/motor-shield/expansion.md
